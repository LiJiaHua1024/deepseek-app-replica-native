name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (optional when triggered manually)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore if configured
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            mkdir -p keystore
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests, lint and build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && 'keystore/release.jks' || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Prepare release APK file
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            OUT="dist/dsnative-${TAG}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$OUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            OUT="dist/dsnative-${TAG}-unsigned.apk"
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$OUT"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.apk.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
